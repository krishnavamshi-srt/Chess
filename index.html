<style>
:root{--bg:#2a2750;--card:rgba(48,44,100,.86);--lt:#faf0e6;--dk:#4a8fb0;--bdr:#2a2750;--w1:#ffd6e4;--w2:#eb8db4;--ws:#5b3a8c;--b1:#5a6bcb;--b2:#1c2561;--bs:#9fb4ff;--tx:#f4f1ff;--mu:#b5b0dd;--ac:#56c4b8;--vh:100vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.wrap{max-width:620px;margin:auto;padding:8px}

#bar{align-self:stretch;background:#1c1a3a;border-radius:4px;position:relative;overflow:hidden}
#barw{position:absolute;bottom:0;left:0;right:0;background:#f8efe6;height:50%;transition:height .3s}

.sq{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.l{background:var(--lt)}.d{background:var(--dk)}

.rk,.fl{position:absolute;font:700 11px sans-serif;pointer-events:none}
.rk{left:3px;top:1px}.fl{right:3px;bottom:1px}
.l .rk,.l .fl{color:var(--dk)}.d .rk,.d .fl{color:var(--lt)}
.ps{width:92%;height:92%;pointer-events:none;filter:drop-shadow(0 1.5px 1px rgba(20,10,50,.35))}
.pw use{fill:url(#gw);stroke:var(--ws);stroke-width:3;stroke-linejoin:round;color:var(--ws)}
.pb use{fill:url(#gb);stroke:var(--bs);stroke-width:2.6;stroke-linejoin:round;color:var(--bs)}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(70,70,70,.38);pointer-events:none}
.cap{position:absolute;inset:3%;border-radius:50%;border:5px solid rgba(70,70,70,.38);pointer-events:none}
#ar{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
#gh{position:fixed;pointer-events:none;display:none;z-index:99;transform:translate(-50%,-62%)}
.card{background:var(--card);border-radius:10px;padding:10px;margin-top:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;border-radius:8px;border:0}
button{background:#4b46a0;color:#fff;padding:9px 12px;font-weight:600}
button.p{background:var(--ac);color:#102}
select{background:#4b46a0;color:#fff;padding:7px}
input[type=text],textarea{background:#1c1a3a;color:#fff;padding:10px;width:100%}
#mvin{flex:1;min-width:0}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
#hint,#lines,#rev{font-size:14px;line-height:1.45}
.ln{padding:5px 0;border-bottom:1px solid #4b46a0}.ln b{color:#ffe066}
.g{color:#7ee787}.y{color:#ffe066}.o{color:#ffa459}.r{color:#ff6b6b}
.mv{display:inline-block;margin:2px;padding:3px 7px;border-radius:5px;background:#4b46a0;font-size:13px}
.mv.on{outline:2px solid var(--ac)}
details summary{color:var(--mu);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;border-radius:13px;padding:0;margin-top:8px;background:linear-gradient(90deg,#5f9b46 var(--p,50%),rgba(255,255,255,.2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0007}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border:0;border-radius:50%;background:#fff}
.tabs button{background:none;opacity:.6;border-radius:0}.tabs button.on{opacity:1;box-shadow:inset 0 -3px var(--ac)}
.sw{display:inline-block;position:relative;width:58px;height:58px;margin:3px;border-radius:9px;border:3px solid transparent;overflow:hidden;cursor:pointer;vertical-align:top}
.sw.on{border-color:#7fd34a}
.sp{position:absolute;bottom:3px;width:52%;height:86%}.sp use{fill:var(--f);stroke:var(--s);stroke-width:4;stroke-linejoin:round}

.rk,.fl{font:700 12px sans-serif}
.bg{position:absolute;right:3px;top:3px;min-width:26px;height:26px;border-radius:13px;color:#fff;font:800 14px/26px sans-serif;text-align:center;z-index:6;box-shadow:0 1px 3px #0007;display:none;font-style:normal}
#dock{height:300px;display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 8% 70%,#e98fb8 0 7%,transparent 8%),radial-gradient(circle at 94% 40%,#f4b8d0 0 8%,transparent 9%),radial-gradient(circle at 20% 15%,#4c9a5a 0 6%,transparent 7%),radial-gradient(circle at 80% 85%,#58a35e 0 7%,transparent 8%),linear-gradient(#2b78b8,#14508a)}
#on{text-align:center;padding:10px 8px 6px;font-size:18px;font-weight:700;text-shadow:0 1px 4px #0008}
#ml,#ex{flex:1;overflow:auto;position:relative;padding:0 18px 80px;font-size:22px;font-weight:700;text-shadow:0 1px 4px #0009}
.mr{display:grid;grid-template-columns:20% 1fr 1fr;align-items:center;padding:8px 0}.mr i{font-style:normal;opacity:.7}
.mv{background:none;margin:0;padding:0;font-size:inherit;cursor:pointer;outline:0!important}.mv.on{text-decoration:underline;text-underline-offset:6px}
.xr{display:flex;gap:18px;align-items:center;padding:8px 0}.xr b{min-width:72px}.xr span{font-size:16px;font-weight:600;opacity:.9}
#tb{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;z-index:20;display:flex;justify-content:space-around;align-items:flex-end;padding:4px 6px env(safe-area-inset-bottom,0px);background:linear-gradient(transparent,rgba(5,30,50,.5))}
.tb{background:none;color:#fff;font-size:15px;font-weight:700;line-height:1.15;padding:6px 8px 10px;text-shadow:0 1px 3px #000}.tb b{display:block;font-size:30px}

#sheet{position:fixed;inset:0;background:rgba(14,22,46,.97);overflow:auto;display:none;z-index:50}#sheet.show{display:block}#shin{max-width:560px;margin:auto;padding:10px 10px 40px}

const BGS=[['Violet','linear-gradient(160deg,#2a2750,#4b2a6a)'],['Sky','linear-gradient(180deg,#3d8fd6,#8cc6f0 50%,#d4ebfa)'],['Forest','linear-gradient(160deg,#0f2f22,#2f6b4a)'],['Sunset','linear-gradient(160deg,#3a1c4a,#d9634a)'],['Night','linear-gradient(#111,#111)']];
let bi=0,pi=0,bgi=0,tab='b',bgData='';
function applyTheme(){const r=document.documentElement.style,B=BOARDS[bi],P=PIECES[pi];
 [['--lt',B[1]],['--dk',B[2]],['--bdr',B[3]],['--gap',B[4]?'1px':'0px'],['--w1',P[1][0]],['--w2',P[1][1]],['--ws',P[1][2]],['--b1',P[2][0]],['--b2',P[2][1]],['--bs',P[2][2]]].forEach(x=>r.setProperty(x[0],x[1]));
 r.setProperty('--bgi',bgi<0&&bgData?'url('+bgData+')':BGS[Math.max(0,bgi)][1])}
function panel(){let h='';
 if(tab==='b')BOARDS.forEach((b,i)=>h+=`<div class="sw ${i===bi?'on':''}" data-k="b${i}" title="${b[0]}" style="background:conic-gradient(${b[1]} 25%,${b[2]} 0 50%,${b[1]} 0 75%,${b[2]} 0)"></div>`);
 if(tab==='p'){const P=PIECES[pi],sv=(i,c,f,t,side)=>`<svg class="sp" viewBox="0 0 100 100" style="${side}:0;--f:${c[1]};--s:${c[2]}"><use href="#P${f}-${t}"/></svg>`;
  h+='<div style="font-size:12px;color:var(--mu)">Shape</div>';
  SHAPES.forEach((n,i)=>h+=`<div class="sw ${i===sh?'on':''}" data-k="s${i}" title="${n}" style="background:#5f86a8">${sv(i,P[1],i,'n','left')}${sv(i,P[2],i,'q','right')}</div>`);
  h+='<div style="font-size:12px;color:var(--mu);margin-top:6px">Colors</div>';
  PIECES.forEach((x,i)=>h+=`<div class="sw ${i===pi?'on':''}" data-k="p${i}" title="${x[0]}" style="background:#5f86a8">${sv(i,x[1],sh,'n','left')}${sv(i,x[2],sh,'n','right')}</div>`)}
 if(tab==='g'){BGS.forEach((g,i)=>h+=`<div class="sw ${i===bgi?'on':''}" data-k="g${i}" title="${g[0]}" style="background:${g[1]}"></div>`);h+='<label class="sw" style="display:flex;align-items:center;justify-content:center;background:#444;font-size:24px">📷<input type="file" accept="image/*" hidden></label>'}
 h+=`<div style="font-size:12px;color:var(--mu)">${tab==='b'?'Board: '+BOARDS[bi][0]:tab==='p'?'Shape: '+SHAPES[sh]+' · Colors: '+PIECES[pi][0]:'Background: '+(bgi<0?'My photo':BGS[bgi][0])}</div>`;
 $('pn').innerHTML=h;const f=$('pn').querySelector('input[type=file]');
 if(f)f.onchange=()=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);bgData=c.toDataURL('image/jpeg',.7);bgi=-1;applyTheme();panel();save()};im.src=fr.result};fr.readAsDataURL(f.files[0])}}
$('pn').onclick=e=>{const w=e.target.closest('.sw');if(!w||!w.dataset.k)return;const k=w.dataset.k,n=+k.slice(1);
 if(k[0]==='b')bi=n;else if(k[0]==='p')pi=n;else if(k[0]==='s')sh=n;else bgi=n;applyTheme();panel();render();save()};

function save(){try{localStorage.setItem('cb4',JSON.stringify({s:KEYS.map(k=>$(k).value),bi,pi,sh,bgi,bg:bgData}))}catch(e){}}

const AS={snd:1,bar:1,sug:1,thr:1,eng:1,fb:1},cls=[],AK='cb4a';let exm=0;
try{Object.assign(AS,JSON.parse(localStorage.getItem(AK)||'{}'))}catch(e){}
const FG={N:'♞',B:'♝',R:'♜',Q:'♛',K:'♚'},fig=(s,w)=>FG[s[0]]?`<span class="fg ${w?'fw':'fb'}">${FG[s[0]]}&#xFE0E;</span>${s.slice(1)}`:s;
const OPEN={'e4':"King's Pawn Opening",'e4 e5':"King's Pawn Game",'e4 e5 Nf3 Nc6':"King's Knight Opening",'e4 e5 Nf3 Nc6 Bb5':'Ruy Lopez','e4 e5 Nf3 Nc6 Bc4':'Italian Game','e4 e5 Nf3 Nc6 d4':'Scotch Game','e4 c5':'Sicilian Defense','e4 c5 Nf3':'Sicilian Defense: Open','e4 c5 d4 cxd4':'Sicilian Defense: Open','e4 c5 d4 cxd4 Qxd4':'Sicilian Defense: Smith-Morra Gambit','e4 e6':'French Defense','e4 e6 d4 d5':'French Defense: Normal Variation','e4 c6':'Caro-Kann Defense','e4 d5':'Scandinavian Defense','e4 d6 d4 Nf6':'Pirc Defense','d4':"Queen's Pawn Opening",'d4 d5':"Queen's Pawn Game",'d4 d5 c4':"Queen's Gambit",'d4 Nf6':'Indian Defense','d4 Nf6 c4 g6':"King's Indian Defense",'c4':'English Opening','Nf3':'Zukertort Opening'};
const sk=k=>mv.slice(0,k).map(x=>x.san.replace(/[+#]/g,'')).join(' ');
function openName(){if(startFen)return'';for(let k=pos;k>0;k--)if(OPEN[sk(k)])return OPEN[sk(k)];return''}
function bookLen(){if(startFen)return 0;for(let k=mv.length;k>0;k--)if(OPEN[sk(k)])return k;return 0}
const clsAt=i=>cls[i]||(i>=0&&i<bookLen()?{s:'📖',c:'#e6c79c'}:null);
function pvTxt(fen,pv){const t=new Chess(fen);let n=+fen.split(' ')[5],w=t.turn()==='w',o='';pv.slice(0,8).forEach((u,i)=>{const m=t.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});if(!m)return;if(w)o+=n+'. ';else if(!i)o+=n+'… ';o+=fig(m.san,w)+' ';if(!w)n++;w=!w});return o}
function threats(){const res=[],q=ch.fen().split(' ');q[1]=q[1]==='w'?'b':'w';q[3]='-';let t;try{t=new Chess(q.join(' '))}catch(e){return res}
 for(const m of t.moves({verbose:true})){if(!m.captured||m.flags.includes('e'))continue;let d=PVAL[m.piece]<PVAL[m.captured];
  if(!d){t.move(m);d=!t.moves({verbose:true}).some(x=>x.to===m.to&&x.captured);t.undo()}
  if(d)res.push(m.from+m.to)}
 return res.slice(0,4)}
let ac;function beep(){if(!AS.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=230;g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.09);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.1)}catch(e){}}
